<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Seviye Tespit Testi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        header {
            background: #4a5568;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
        }
        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .progress-bar {
            height: 8px;
            background: #e2e8f0;
        }
        .progress {
            height: 100%;
            background: #48bb78;
            width: 0%;
            transition: width 0.3s ease;
        }
        .quiz-area {
            padding: 30px 25px;
        }
        .question-number {
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 22px;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            background: #f7fafc;
        }
        .option:hover {
            border-color: #667eea;
            background: #edf2f7;
        }
        .option.selected {
            border-color: #667eea;
            background: #ebf4ff;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 12px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        #prevBtn {
            background: #e2e8f0;
            color: #4a5568;
        }
        #prevBtn:hover {
            background: #cbd5e0;
        }
        #nextBtn, #submitBtn {
            background: #667eea;
            color: white;
            margin-left: auto;
        }
        #nextBtn:hover, #submitBtn:hover {
            background: #5a67d8;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result-screen {
            display: none;
            text-align: center;
            padding: 40px 25px;
        }
        .result-screen h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #2d3748;
        }
        .score {
            font-size: 3rem;
            font-weight: 700;
            color: #667eea;
            margin: 20px 0;
        }
        .level {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .description {
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .restart-btn {
            background: #48bb78;
            color: white;
            padding: 14px 32px;
        }
        .restart-btn:hover {
            background: #38a169;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>İngilizce Seviye Tespit Testi</h1>
            <p>10 soruluk kısa test • Doğru cevaplar tamamen karışık</p>
        </header>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="quiz-area" id="quizArea">
            <div class="question-number" id="questionNumber">Soru 1 / 10</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="options"></div>
            
            <div class="controls">
                <button id="prevBtn" disabled>← Önceki</button>
                <button id="nextBtn">Sonraki →</button>
                <button id="submitBtn" class="hidden">Sonuçları Gör</button>
            </div>
        </div>

        <div class="result-screen" id="resultScreen">
            <h2>Test Sonucu</h2>
            <div class="score" id="scoreDisplay">0/10</div>
            <div class="level" id="levelDisplay"></div>
            <div class="description" id="description"></div>
            <button class="restart-btn" onclick="restartQuiz()">Tekrar Dene</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which sentence is grammatically correct?",
                options: [
                    "She don't like coffee.",
                    "She doesn't likes coffee.",
                    "She not like coffee.",
                    "She doesn't like coffee."
                ],
                correct: 3   // 4. seçenek
            },
            {
                question: "Choose the correct word: I have been living here _____ 2018.",
                options: [
                    "for",
                    "during",
                    "since",
                    "while"
                ],
                correct: 2   // 3. seçenek
            },
            {
                question: "What is the past participle of 'write'?",
                options: [
                    "wrote",
                    "writing",
                    "writes",
                    "written"
                ],
                correct: 3   // 4. seçenek
            },
            {
                question: "Select the correct sentence:",
                options: [
                    "If I will see him, I will tell him.",
                    "If I see him, I will tell him.",
                    "If I saw him, I will tell him.",
                    "If I see him, I would tell him."
                ],
                correct: 1   // 2. seçenek
            },
            {
                question: "Which word is a synonym of 'happy'?",
                options: [
                    "sad",
                    "angry",
                    "tired",
                    "joyful"
                ],
                correct: 3   // 4. seçenek
            },
            {
                question: "Complete: She is interested _____ learning languages.",
                options: [
                    "on",
                    "at",
                    "for",
                    "in"
                ],
                correct: 3   // 4. seçenek
            },
            {
                question: "Choose the correct form: By this time tomorrow, I _____ the report.",
                options: [
                    "will finish",
                    "finish",
                    "will have finished",
                    "am finishing"
                ],
                correct: 2   // 3. seçenek
            },
            {
                question: "What does 'to break the ice' mean?",
                options: [
                    "To destroy something cold",
                    "To stop talking",
                    "To make someone angry",
                    "To start a conversation in a friendly way"
                ],
                correct: 3   // 4. seçenek
            },
            {
                question: "Which sentence uses the passive voice correctly?",
                options: [
                    "The letter was written by John.",
                    "John was written the letter.",
                    "The letter wrote by John.",
                    "John written the letter."
                ],
                correct: 0   // 1. seçenek
            },
            {
                question: "Choose the correct comparative form:",
                options: [
                    "more better",
                    "more good",
                    "gooder",
                    "better"
                ],
                correct: 3   // 4. seçenek
            }
        ];

        let currentQuestion = 0;
        let userAnswers = new Array(questions.length).fill(null);

        const questionNumberEl = document.getElementById('questionNumber');
        const questionTextEl = document.getElementById('questionText');
        const optionsEl = document.getElementById('options');
        const progressEl = document.getElementById('progress');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const quizArea = document.getElementById('quizArea');
        const resultScreen = document.getElementById('resultScreen');

        function loadQuestion() {
            const q = questions[currentQuestion];
            questionNumberEl.textContent = `Soru ${currentQuestion + 1} / ${questions.length}`;
            questionTextEl.textContent = q.question;
            
            optionsEl.innerHTML = '';
            q.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                if (userAnswers[currentQuestion] === index) {
                    div.classList.add('selected');
                }
                div.textContent = opt;
                div.onclick = () => selectOption(index);
                optionsEl.appendChild(div);
            });

            progressEl.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

            prevBtn.disabled = currentQuestion === 0;
            
            if (currentQuestion === questions.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        function selectOption(index) {
            userAnswers[currentQuestion] = index;
            const options = optionsEl.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.toggle('selected', i === index);
            });
        }

        prevBtn.onclick = () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        };

        nextBtn.onclick = () => {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            }
        };

        submitBtn.onclick = () => {
            showResults();
        };

        function showResults() {
            let correctCount = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) correctCount++;
            });

            const percentage = (correctCount / questions.length) * 100;
            let level, description;

            if (percentage >= 90) {
                level = "C1 - Advanced";
                description = "Harika! İngilizcen ileri seviyede. Akademik ve profesyonel ortamlarda rahatlıkla kullanabilirsin.";
            } else if (percentage >= 75) {
                level = "B2 - Upper Intermediate";
                description = "Çok iyi! Konuşma, yazma ve anlama konusunda oldukça yetkinsin. Biraz daha pratikle C1'e çıkabilirsin.";
            } else if (percentage >= 55) {
                level = "B1 - Intermediate";
                description = "İyi bir orta seviyedesin. Günlük konuşmaları anlayıp katılabilirsin. Kelime dağarcığını ve dilbilgisini güçlendirmeni öneririm.";
            } else if (percentage >= 35) {
                level = "A2 - Elementary";
                description = "Temel seviyedesin. Basit cümleler kurabiliyorsun. Düzenli pratik ve kelime çalışmasıyla hızla ilerleyebilirsin.";
            } else {
                level = "A1 - Beginner";
                description = "Yeni başlıyorsun. Temel kelimeler ve basit cümle yapılarıyla başla. Kısa sürede ilerleme göreceksin!";
            }

            document.getElementById('scoreDisplay').textContent = `\( {correctCount}/ \){questions.length}`;
            document.getElementById('levelDisplay').textContent = level;
            document.getElementById('description').textContent = description;

            quizArea.style.display = 'none';
            resultScreen.style.display = 'block';
        }

        function restartQuiz() {
            currentQuestion = 0;
            userAnswers = new Array(questions.length).fill(null);
            quizArea.style.display = 'block';
            resultScreen.style.display = 'none';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
