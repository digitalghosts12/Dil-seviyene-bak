<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dil Seviye Tespit Testi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        header {
            background: #2d3748;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }
        header h1 { font-size: 1.7rem; margin-bottom: 6px; }
        header p { font-size: 0.95rem; opacity: 0.9; }
        .screen { padding: 30px 25px; }
        .hidden { display: none !important; }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 10px;
        }
        .lang-btn {
            padding: 22px 10px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #f7fafc;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .lang-btn:hover {
            border-color: #667eea;
            background: #ebf4ff;
            transform: translateY(-2px);
        }
        .lang-btn span {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #718096;
            margin-top: 4px;
        }

        .progress-bar { height: 8px; background: #e2e8f0; }
        .progress { height: 100%; background: #48bb78; width: 0%; transition: width 0.3s; }
        .question-number { font-size: 0.9rem; color: #718096; margin-bottom: 8px; }
        .question-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 22px; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            background: #f7fafc;
            font-size: 1.15rem;
            transition: all 0.2s;
        }
        .option:hover { border-color: #667eea; background: #edf2f7; }
        .option.selected { border-color: #667eea; background: #ebf4ff; }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            gap: 12px;
        }
        button {
            padding: 14px 26px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        #prevBtn { background: #e2e8f0; color: #4a5568; }
        #prevBtn:hover { background: #cbd5e0; }
        #nextBtn, #submitBtn { background: #667eea; color: white; margin-left: auto; }
        #nextBtn:hover, #submitBtn:hover { background: #5a67d8; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }

        .result-screen { text-align: center; padding: 40px 25px; }
        .score { font-size: 3.2rem; font-weight: 700; color: #2d3748; margin: 18px 0; }
        .level { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; color: #2d3748; }
        .description { color: #4a5568; margin-bottom: 28px; line-height: 1.55; font-size: 1.05rem; }
        .restart-btn { background: #48bb78; color: white; padding: 15px 36px; }
        .restart-btn:hover { background: #38a169; }
        .back-lang { background: #edf2f7; color: #4a5568; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dil Seviye Tespit Testi</h1>
            <p id="headerDesc">Hangi dili test etmek istiyorsun?</p>
        </header>

        <div class="screen" id="langScreen">
            <div class="lang-grid">
                <div class="lang-btn" onclick="startQuiz('japanese')">🇯🇵 Japonca<span>日本語</span></div>
                <div class="lang-btn" onclick="startQuiz('korean')">🇰🇷 Korece<span>한국어</span></div>
                <div class="lang-btn" onclick="startQuiz('russian')">🇷🇺 Rusça<span>Русский</span></div>
                <div class="lang-btn" onclick="startQuiz('english')">🇬🇧 İngilizce<span>English</span></div>
                <div class="lang-btn" onclick="startQuiz('french')">🇫🇷 Fransızca<span>Français</span></div>
                <div class="lang-btn" onclick="startQuiz('spanish')">🇪🇸 İspanyolca<span>Español</span></div>
            </div>
        </div>

        <div class="hidden" id="quizScreen">
            <div class="progress-bar"><div class="progress" id="progress"></div></div>
            <div class="screen">
                <div class="question-number" id="questionNumber">Soru 1 / 30</div>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="options"></div>
                <div class="controls">
                    <button id="prevBtn" disabled>← Önceki</button>
                    <button id="nextBtn">Sonraki →</button>
                    <button id="submitBtn" class="hidden">Sonuçları Gör</button>
                </div>
            </div>
        </div>

        <div class="result-screen hidden" id="resultScreen">
            <h2>Test Sonucu</h2>
            <div class="score" id="scoreDisplay">0/30</div>
            <div class="level" id="levelDisplay"></div>
            <div class="description" id="description"></div>
            <button class="restart-btn" onclick="restartQuiz()">Aynı Dilde Tekrar Dene</button>
            <br>
            <button class="back-lang" onclick="backToLang()">Başka Dil Seç</button>
        </div>
    </div>

                {q:"« До свидания » ne zaman kullanılır?", o:["Merhaba","Hoşça kal","Teşekkür","Özür"], c:1},

                {q:"« Вы говорите по-русски? »", o:["Rusça konuşuyor musunuz?","Rus musunuz?","Rusya'da mısınız?","Rusça seviyor musunuz?"], c:0},

                {q:"« Мне нравится » ne demek?", o:["İstiyorum","Seviyorum","Yapıyorum","Görüyorum"], c:1},
                {q:"Rusça teşekkürlerin cevabı?", o:["Спасибо","Пожалуйста","Извините","Хорошо"], c:1}
            ]
        };

        let currentLang = null;
        let questions = [];
        let currentQuestion = 0;
        let userAnswers = [];

        const langScreen = document.getElementById('langScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');
        const headerDesc = document.getElementById('headerDesc');
        const questionNumberEl = document.getElementById('questionNumber');
        const questionTextEl = document.getElementById('questionText');
        const optionsEl = document.getElementById('options');
        const progressEl = document.getElementById('progress');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');

        function startQuiz(lang) {
            currentLang = lang;
            questions = allQuestions[lang];
            currentQuestion = 0;
            userAnswers = new Array(questions.length).fill(null);

            const langNames = {
                japanese: "Japonca",
                korean: "Korece",
                russian: "Rusça",
                english: "İngilizce",
                french: "Fransızca",
                spanish: "İspanyolca"
            };
            headerDesc.textContent = langNames[lang] + " • 30 Soru";

            langScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            questionNumberEl.textContent = `Soru ${currentQuestion + 1} / ${questions.length}`;
            questionTextEl.textContent = q.q;

            optionsEl.innerHTML = '';
            q.o.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option' + (userAnswers[currentQuestion] === index ? ' selected' : '');
                div.textContent = opt;
                div.onclick = () => selectOption(index);
                optionsEl.appendChild(div);
            });

            progressEl.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            prevBtn.disabled = currentQuestion === 0;

            if (currentQuestion === questions.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        function selectOption(index) {
            userAnswers[currentQuestion] = index;
            optionsEl.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.toggle('selected', i === index);
            });
        }

        prevBtn.onclick = () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        };

        nextBtn.onclick = () => {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            }
        };

        submitBtn.onclick = () => showResults();

        function showResults() {
            let correct = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.c) correct++;
            });

            const pct = (correct / questions.length) * 100;
            let level, desc;

            if (pct >= 90) {
                level = "C1 – İleri Seviye";
                desc = "Harika! Bu dilde ileri seviyedesin. Akıcı konuşup yazabilirsin.";
            } else if (pct >= 75) {
                level = "B2 – Orta-Üstü";
                desc = "Çok iyi! Günlük ve birçok profesyonel durumda rahat kullanabilirsin.";
            } else if (pct >= 55) {
                level = "B1 – Orta Seviye";
                desc = "İyi bir orta seviyedesin. Temel konuşmaları anlayıp katılabilirsin.";
            } else if (pct >= 35) {
                level = "A2 – Temel Seviye";
                desc = "Temel seviyedesin. Basit cümleler kurabiliyorsun, pratikle hızla ilerlersin.";
            } else {
                level = "A1 – Başlangıç";
                desc = "Yeni başlıyorsun. Temel kelime ve kalıplarla başla, kısa sürede yol alırsın.";
            }

            document.getElementById('scoreDisplay').textContent = `\( {correct}/ \){questions.length}`;
            document.getElementById('levelDisplay').textContent = level;
            document.getElementById('description').textContent = desc;

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            headerDesc.textContent = "Test Sonucu";
        }

        function restartQuiz() {
            currentQuestion = 0;
            userAnswers = new Array(questions.length).fill(null);
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            const langNames = {japanese:"Japonca",korean:"Korece",russian:"Rusça",english:"İngilizce",french:"Fransızca",spanish:"İspanyolca"};
            headerDesc.textContent = langNames[currentLang] + " • 30 Soru";
            loadQuestion();
        }

        function backToLang() {
            resultScreen.classList.add('hidden');
            quizScreen.classList.add('hidden');
            langScreen.classList.remove('hidden');
            headerDesc.textContent = "Hangi dili test etmek istiyorsun?";
        }
    </script>
